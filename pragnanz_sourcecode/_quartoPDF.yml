format:
  html:
    theme: cosmo
    # toc-title: '<img id = "tocimage" src = "chapterfigs/0.jpg" style = "width:150px;">'
    reader-mode: true
    linkcolor: dodgerblue
    link-external-newwindow: true
    link-external-icon: false
    cover-image: chapterfigs/0.jpg
  pdf:
    pdf-engine: pdflatex
    documentclass: book
    indent: true
    papersize: a4paper
    fontsize: '11'
    linestretch: 1.5
    whitespace: none
    colorlinks: true
    urlcolor: dodgerblue
    linkcolor: dodgerblue
    citecolor: dodgerblue
    geometry: margin=1in
    template-partials: 
      - before-body.tex
    include-in-header: 
      - preamble.tex
